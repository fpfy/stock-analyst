version: '3.8'

services:
  stock-analysis:
    build: .
    container_name: stock-analysis-system
    restart: unless-stopped
    volumes:
      - ./database:/app/database
      - ./logs:/app/logs
      - ./reports:/app/reports
      - ./data:/app/data
    environment:
      - TUSHARE_TOKEN=${TUSHARE_TOKEN}
      - LOG_LEVEL=INFO
      - DB_PATH=/app/database/stock_analysis.db
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import sqlite3; sqlite3.connect('database/stock_analysis.db')"]
      interval: 30s
      timeout: 10s
      retries: 3
    resources:
      limits:
        cpus: '2'
        memory: 4G
      reservations:
        cpus: '0.5'
        memory: 1G

  # 可选：Redis缓存服务
  redis:
    image: redis:7-alpine
    container_name: stock-analysis-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    resources:
      limits:
        memory: 512M

volumes:
  redis_data:
